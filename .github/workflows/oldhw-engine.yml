# TokenRun's ready-made Strata engine, release engine-v<ENGINE_VERSION>.  From 0.1.57 the official release of
# Niko1221/Strata (tag ENGINE_SOURCE_TAG) has Windows and Linux CUDA 13 engines: they are published here unchanged,
# checked against the SHA-256 the official release lists (tools/ci_package.py OFFICIAL), in the zip setup.py reads
# (every file at the top, BUILD.json with setup's fields).  setup.py downloads it from the release engine-v<version>
# (PREBUILT_TAG_URL; a copy on ModelScope, MS_ENGINE_REPO).  Run it by hand after changing ENGINE_VERSION
# (gh workflow run oldhw-engine.yml).  Before 0.1.57 this job compiled the official source (STRATA_PORTABLE,
# CUDA 13.0, RTX 20/30/40/50); git history has that version.
name: engine (official Strata for TokenRun)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/oldhw-engine.yml"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: the official archives, checked and repacked
        run: |
          mkdir -p dist
          python3 tools/ci_package.py repack windows --out dist/strata-windows-x64.zip
          python3 tools/ci_package.py repack linux --out dist/strata-linux-x64.zip
          rm -f dist/*.tar.gz
          ls -la dist
      - name: release engine-v<version>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 tools/ci_package.py engine-version)
          T=$(python3 tools/ci_package.py engine-tag)
          TAG="engine-v$V"
          NOTES="Strata engine $V for TokenRun: the official release's CUDA 13 engines (Niko1221/Strata, tag $T: strata-engine-$V-windows-x86_64-cuda-cuda13.tar.gz and strata-engine-$V-linux-x86_64-cuda-cuda13.tar.gz), unchanged and checked against their SHA-256, repacked as the zip TokenRun's setup reads (TokenRun ${GITHUB_SHA::7}). They carry their own cuBLAS (and, on Linux, CUDA runtime). TokenRun runs them with serve/server.py engine_env, which keeps the earlier answer rules (STRATA_PCIE_K_RULE=0, STRATA_PCIE_SHARE_MAX=0.60, STRATA_NV_CHUNK=0, STRATA_MMQ_KQ=0, STRATA_ROUTE_TAIL_SKIP=0, STRATA_PREFILL_CPU_SHARE=0). Linux measured on an RTX 4060 Ti 16 GB / Xeon E5-2673 v3 / DDR3, UD-IQ4_XS, MTP: 0.1.44.1 20.04 tok/s, $V 21.15 (+5.5%, 5 interleaved rounds of 8 prompts). Windows: NOT yet tested on a Windows PC with a GPU."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG (Strata engine)" --notes "$NOTES" --latest=false
          gh release edit "$TAG" --notes "$NOTES"
          gh release upload "$TAG" dist/*.zip --clobber
      # the same archives on ModelScope for mainland China (setup.py tries it first there); skipped without the token
      - name: copy on ModelScope
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_REPO: ${{ vars.MODELSCOPE_REPO }}
        run: |
          python3 -m pip install "modelscope-hub==0.4.5"
          python3 tools/ci_package.py modelscope dist/*.zip
